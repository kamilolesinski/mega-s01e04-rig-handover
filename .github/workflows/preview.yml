name: preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: "Show the lane marker (LANE_MARKER secret) in the preview banner"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Test
        run: corepack pnpm test

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Start rig
        env:
          INCLUDE_MARKER: ${{ inputs.include_marker }}
          LANE_ID: lane-07
          PORT: 8787
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
        run: |
          if [ "$INCLUDE_MARKER" = "true" ] && [ -z "$LANE_MARKER" ]; then
            echo "include_marker is true but the LANE_MARKER secret is empty" >&2
            exit 1
          fi
          mkdir -p var
          corepack pnpm start > var/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:$PORT/" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://localhost:$PORT/" > /dev/null

      - name: Save digest page
        run: |
          mkdir -p var/preview
          curl -fsS "http://localhost:8787/digest/2026-10-28" -o var/preview/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: var/preview

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
